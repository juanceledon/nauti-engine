<div class="grid grid-cols-1 gap-4 md:grid-cols-3">
  <article class="nauti-card relative p-4">
    <p class="nauti-label">Total Carriers Contacted</p>
    <p class="mt-2 font-display text-4xl font-semibold tracking-tight text-neon drop-shadow-[0_0_12px_rgba(74,222,128,0.35)]">
      {{ carriersContacted() }}
    </p>
    <svg [lucideIcon]="icons.trend" class="absolute top-4 right-4 size-4 text-neon"></svg>
  </article>
  <article class="nauti-card relative p-4">
    <p class="nauti-label">Verified Deals</p>
    <p class="mt-2 font-display text-4xl font-semibold tracking-tight">{{ verifiedDeals() }}</p>
    <svg [lucideIcon]="icons.check" class="absolute top-4 right-4 size-4 text-muted"></svg>
  </article>
  <article class="nauti-card relative p-4">
    <p class="nauti-label">Audit Compliance</p>
    <p class="mt-2 font-display text-4xl font-semibold tracking-tight">{{ complianceRate() }}%</p>
    <svg [lucideIcon]="icons.shield" class="absolute top-4 right-4 size-4 text-muted"></svg>
  </article>
</div>
