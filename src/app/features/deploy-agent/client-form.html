<form
  class="max-h-[90vh] w-full overflow-y-auto rounded-lg border border-zinc-700 bg-raised p-6 shadow-[0_20px_25px_-5px_rgb(0_0_0_/_0.5)] sm:p-8"
  (submit)="submit($event)"
>
  <h3 class="font-display text-lg font-semibold tracking-tight">Add Client</h3>
  <div class="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-2">
    <label class="flex flex-col gap-1 sm:col-span-2">
      <span class="nauti-label">Company</span>
      <input
        class="nauti-input px-3 py-2 text-sm"
        [value]="draft().name"
        (input)="patchField('name', $event)"
        required
      />
    </label>
    <label class="flex flex-col gap-1 sm:col-span-2">
      <span class="nauti-label">Contact name</span>
      <input
        class="nauti-input px-3 py-2 text-sm"
        [value]="draft().contact_name"
        (input)="patchField('contact_name', $event)"
        required
      />
    </label>
    <label class="flex flex-col gap-1">
      <span class="nauti-label">Phone</span>
      <div class="nauti-input flex overflow-hidden p-0">
        <input
          class="w-14 shrink-0 border-0 bg-transparent px-1.5 py-2 text-center font-mono text-xs outline-none"
          list="client-dial-codes"
          [value]="dialCode()"
          (input)="onDialInput($event)"
          placeholder="+52"
          aria-label="Country code"
        />
        <datalist id="client-dial-codes">
          @for (option of dialCodes; track option.code) {
            <option [value]="option.code">{{ option.label }}</option>
          }
        </datalist>
        <span class="w-px shrink-0 bg-zinc-700" aria-hidden="true"></span>
        <input
          class="min-w-0 flex-1 border-0 bg-transparent px-3 py-2 font-mono text-sm outline-none"
          type="tel"
          inputmode="numeric"
          placeholder="3116517545"
          [value]="localNumber()"
          (input)="onLocalNumber($event)"
          required
        />
      </div>
    </label>
    <label class="flex flex-col gap-1">
      <span class="nauti-label">Email</span>
      <input
        class="nauti-input px-3 py-2 text-sm"
        type="email"
        [value]="draft().contact_email"
        (input)="patchField('contact_email', $event)"
        required
      />
    </label>
    <div class="flex flex-col gap-1 sm:col-span-2">
      <span class="nauti-label">Direction</span>
      <div class="grid grid-cols-2 gap-2">
        <button
          type="button"
          class="rounded border border-line px-3 py-2 text-sm text-muted hover:text-ink"
          [class.border-neon]="draft().direction === 'outbound'"
          [class.bg-neon/10]="draft().direction === 'outbound'"
          [class.text-ink]="draft().direction === 'outbound'"
          (click)="setDirection('outbound')"
        >
          Outbound
        </button>
        <button
          type="button"
          class="rounded border border-line px-3 py-2 text-sm text-muted hover:text-ink"
          [class.border-neon]="draft().direction === 'inbound'"
          [class.bg-neon/10]="draft().direction === 'inbound'"
          [class.text-ink]="draft().direction === 'inbound'"
          (click)="setDirection('inbound')"
        >
          Inbound
        </button>
      </div>
      <p class="font-mono text-[11px] text-muted">
        @if (draft().direction === 'inbound') {
          Receiving freight into this client.
        } @else {
          Shipping freight out from this client.
        }
      </p>
    </div>
  </div>
  @if (error()) {
    <p class="mt-3 text-sm text-danger">{{ error() }}</p>
  }
  <div class="mt-6 flex justify-end gap-2">
    <button type="button" class="rounded border border-line px-3 py-2 text-sm text-muted" (click)="cancelled.emit()">
      Cancel
    </button>
    <button
      type="submit"
      class="rounded bg-zinc-100 px-3 py-2 text-sm font-medium text-zinc-950 disabled:opacity-50"
      [disabled]="saving()"
    >
      {{ saving() ? 'Saving…' : 'Add Client' }}
    </button>
  </div>
</form>
