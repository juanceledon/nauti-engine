<form
  class="max-h-[90vh] w-full overflow-y-auto rounded-lg border border-zinc-700 bg-raised p-6 shadow-[0_20px_25px_-5px_rgb(0_0_0_/_0.5)] sm:p-8"
  (submit)="submit($event)"
>
  <h3 class="font-display text-lg font-semibold tracking-tight">
    {{ isEdit() ? 'Edit Profile' : 'Add New Carrier' }}
  </h3>
  <div class="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-2">
    <label class="flex flex-col gap-1 sm:col-span-2">
      <span class="nauti-label">Name</span>
      <input
        class="nauti-input px-3 py-2 text-sm"
        [value]="draft().name"
        (input)="patchField('name', $event)"
        required
      />
    </label>
    <label class="flex flex-col gap-1">
      <span class="nauti-label">Owner name</span>
      <input
        class="nauti-input px-3 py-2 text-sm"
        [value]="draft().owner_name"
        (input)="patchField('owner_name', $event)"
        required
      />
    </label>
    <label class="flex flex-col gap-1">
      <span class="nauti-label">Phone</span>
      <div class="nauti-input flex overflow-hidden p-0">
        <input
          class="w-14 shrink-0 border-0 bg-transparent px-1.5 py-2 text-center font-mono text-xs outline-none"
          list="dial-codes"
          [value]="dialCode()"
          (input)="onDialInput($event)"
          placeholder="+52"
          aria-label="Country code"
        />
        <datalist id="dial-codes">
          @for (option of dialCodes; track option.code) {
            <option [value]="option.code">{{ option.label }}</option>
          }
        </datalist>
        <span class="w-px shrink-0 bg-zinc-700" aria-hidden="true"></span>
        <input
          class="min-w-0 flex-1 border-0 bg-transparent px-3 py-2 font-mono text-sm outline-none"
          type="tel"
          inputmode="numeric"
          placeholder="3001234567"
          [value]="localNumber()"
          (input)="onLocalNumber($event)"
          required
        />
      </div>
    </label>
    <label class="flex flex-col gap-1">
      <span class="nauti-label">Email</span>
      <input
        class="nauti-input px-3 py-2 text-sm"
        type="email"
        [value]="draft().email"
        (input)="patchField('email', $event)"
        required
      />
    </label>
    <label class="flex flex-col gap-1">
      <span class="nauti-label">Type</span>
      <input
        class="nauti-input px-3 py-2 text-sm"
        [value]="draft().type"
        (input)="patchField('type', $event)"
      />
    </label>
    <label class="flex flex-col gap-1 sm:col-span-2">
      <span class="nauti-label">Supported routes</span>
      <div class="relative" (focusout)="closeRouteMenu($event)">
        <div
          class="nauti-input flex min-h-10 w-full cursor-text flex-wrap items-center gap-1.5 px-2 py-1.5 pr-8 focus-within:border-zinc-400"
          (click)="openRouteMenu()"
        >
          @for (route of draft().supported_routes; track route) {
            <span class="inline-flex items-center gap-1 rounded border border-line bg-raised px-1.5 py-0.5 font-mono text-[10px] text-ink">
              {{ route }}
              <button
                type="button"
                class="text-muted hover:text-ink"
                (click)="removeRoute(route, $event)"
                aria-label="Remove route"
              >
                <svg [lucideIcon]="icons.close" class="size-3"></svg>
              </button>
            </span>
          }
          <input
            class="min-w-[7rem] flex-1 border-0 bg-transparent py-0.5 font-mono text-sm outline-none placeholder:text-muted/70"
            role="combobox"
            aria-autocomplete="list"
            aria-multiselectable="true"
            [attr.aria-expanded]="routeMenuOpen()"
            [value]="routeDraft()"
            (input)="onRouteDraft($event)"
            (focus)="openRouteMenu()"
            [placeholder]="draft().supported_routes.length ? 'Add another…' : 'Select routes'"
            autocomplete="off"
          />
        </div>
        <button
          type="button"
          class="absolute inset-y-0 right-0 flex items-center px-2 text-muted"
          (click)="toggleRouteMenu(); $event.stopPropagation()"
          tabindex="-1"
          aria-label="Open route options"
        >
          <svg [lucideIcon]="icons.chevron" class="size-3.5"></svg>
        </button>
        @if (routeMenuOpen()) {
          <ul
            class="absolute z-20 mt-1 max-h-56 w-full overflow-auto rounded border border-line bg-raised py-1 shadow-[0_20px_25px_-5px_rgb(0_0_0_/_0.5)]"
            role="listbox"
            aria-multiselectable="true"
          >
            @for (route of routeOptions(); track route.code) {
              <li>
                <button
                  type="button"
                  class="flex w-full items-center gap-2 px-3 py-1.5 text-left font-mono text-[11px] leading-snug hover:bg-zinc-800"
                  [class.bg-zinc-800]="isRouteSelected(route.code)"
                  role="option"
                  [attr.aria-selected]="isRouteSelected(route.code)"
                  (mousedown)="$event.preventDefault(); toggleRoute(route)"
                >
                  <span
                    class="flex size-3.5 shrink-0 items-center justify-center rounded-[3px] border"
                    [class.border-neon]="isRouteSelected(route.code)"
                    [class.bg-neon]="isRouteSelected(route.code)"
                    [class.border-zinc-600]="!isRouteSelected(route.code)"
                  >
                    @if (isRouteSelected(route.code)) {
                      <svg [lucideIcon]="icons.check" class="size-2.5 text-zinc-950"></svg>
                    }
                  </span>
                  {{ displayLabel(route) }}
                </button>
              </li>
            }
            @if (canAddRoute()) {
              <li class="border-t border-line">
                <button
                  type="button"
                  class="w-full px-3 py-1.5 text-left font-mono text-[11px] text-neon hover:bg-zinc-800"
                  (mousedown)="$event.preventDefault(); addTypedRoute()"
                  [disabled]="addingRoute()"
                >
                  {{ addingRoute() ? 'Adding…' : 'Add ' + typedRouteCode() + ' as a new route' }}
                </button>
              </li>
            } @else if (routeOptions().length === 0) {
              <li class="px-3 py-2 font-mono text-xs text-muted">Type a custom route</li>
            }
          </ul>
        }
      </div>
      @if (routeError()) {
        <p class="text-xs text-danger">{{ routeError() }}</p>
      }
    </label>
    <label class="flex flex-col gap-1 sm:col-span-2">
      <span class="nauti-label">Info link</span>
      <input
        class="nauti-input px-3 py-2 text-sm"
        type="url"
        placeholder="https://"
        [value]="draft().info_link"
        (input)="onInfoLinkInput($event)"
        (blur)="onInfoLinkBlur()"
      />
    </label>
    @if (summarizing()) {
      <div class="flex items-center gap-3 sm:col-span-2 rounded border border-line px-3 py-3">
        <svg [lucideIcon]="icons.loader" class="size-4 animate-spin text-neon"></svg>
        <p class="font-mono text-xs text-muted">Reading page and drafting agent summary…</p>
      </div>
    }
    @if (summaryVisible()) {
      <label class="flex flex-col gap-1 sm:col-span-2">
        <span class="nauti-label">Agent summary</span>
        <textarea
          class="nauti-input px-3 py-2 text-sm"
          rows="3"
          [value]="draft().agent_summary"
          (input)="patchField('agent_summary', $event)"
        ></textarea>
        @if (summaryError()) {
          <p class="text-xs text-danger">{{ summaryError() }}</p>
        }
      </label>
    }
  </div>
  @if (error()) {
    <p class="mt-3 text-sm text-danger">{{ error() }}</p>
  }
  <div class="mt-6 flex justify-end gap-2">
    <button type="button" class="rounded border border-line px-3 py-2 text-sm text-muted" (click)="cancelled.emit()">
      Cancel
    </button>
    <button
      type="submit"
      class="rounded bg-zinc-100 px-3 py-2 text-sm font-medium text-zinc-950 disabled:opacity-50"
      [disabled]="saving() || summarizing()"
    >
      {{ saving() ? 'Saving…' : 'Save' }}
    </button>
  </div>
</form>
