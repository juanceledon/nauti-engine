<aside class="flex h-screen w-60 shrink-0 flex-col border-r border-line bg-panel">
  <div class="flex flex-col gap-2 px-5 py-6">
    <img src="nauti-logo.png" alt="Nauti" class="h-9 w-auto max-w-full" />
    <p class="flex items-center gap-1.5 font-mono text-[11px] tracking-wide text-muted">
      <span class="size-1.5 animate-pulse rounded-full bg-neon"></span>
      System Active
    </p>
  </div>

  <nav class="flex flex-1 flex-col gap-1 px-3">
    <a
      routerLink="/command"
      routerLinkActive="border-neon/40 bg-neon/10 text-neon"
      class="flex items-center gap-3 rounded border border-transparent px-3 py-2.5 text-sm text-muted hover:border-line hover:text-ink"
    >
      <svg [lucideIcon]="icons.command" class="size-4"></svg>
      Command
    </a>

    <a
      routerLink="/negotiations"
      routerLinkActive="border-neon/40 bg-neon/10 text-neon"
      class="flex items-center gap-3 rounded border border-transparent px-3 py-2.5 text-sm text-muted hover:border-line hover:text-ink"
    >
      <svg [lucideIcon]="icons.negotiations" class="size-4 shrink-0"></svg>
      <span class="leading-tight">Negotiations</span>
    </a>

    <a
      routerLink="/carriers"
      routerLinkActive="border-neon/40 bg-neon/10 text-neon"
      class="flex items-center gap-3 rounded border border-transparent px-3 py-2.5 text-sm text-muted hover:border-line hover:text-ink"
    >
      <svg [lucideIcon]="icons.truck" class="size-4"></svg>
      Carriers
    </a>

    <a
      routerLink="/client"
      routerLinkActive="border-neon/40 bg-neon/10 text-neon"
      [routerLinkActiveOptions]="{ exact: true }"
      class="flex items-center gap-3 rounded border border-transparent px-3 py-2.5 text-sm text-muted hover:border-line hover:text-ink"
    >
      <svg [lucideIcon]="icons.client" class="size-4"></svg>
      Clients
    </a>

    <a
      routerLink="/quote-history"
      routerLinkActive="border-neon/40 bg-neon/10 text-neon"
      class="flex items-center gap-3 rounded border border-transparent px-3 py-2.5 text-sm text-muted hover:border-line hover:text-ink"
    >
      <svg [lucideIcon]="icons.history" class="size-4"></svg>
      Quote History
    </a>
  </nav>

  <div class="space-y-1 px-3 pb-6">
    <a
      routerLink="/deploy"
      routerLinkActive="ring-1 ring-neon/50"
      class="flex w-full items-center justify-start gap-3 rounded bg-zinc-100 px-3 py-2.5 text-sm font-medium text-zinc-950"
    >
      <svg [lucideIcon]="icons.rocket" class="size-4"></svg>
      Deploy Agent
    </a>

    <a href="#" class="flex items-center gap-3 rounded px-3 py-2 text-sm text-muted hover:text-ink">
      <svg [lucideIcon]="icons.help" class="size-4"></svg>
      Support
    </a>

    <a href="#" class="flex items-center gap-3 rounded px-3 py-2 text-sm text-muted hover:text-ink">
      <svg [lucideIcon]="icons.account" class="size-4"></svg>
      Account
    </a>
  </div>
</aside>
