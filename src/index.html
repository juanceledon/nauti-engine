<!doctype html>
<html lang="en" data-theme="nauti">
  <head>
    <meta charset="utf-8" />
    <script>
      document.documentElement.setAttribute(
        'data-theme',
        localStorage.getItem('nauti-theme') === 'nauti-dark' ? 'nauti-dark' : 'nauti',
      );
    </script>
    <title>Nauti Dispatch</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="favicon.png?v=3" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=3" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
